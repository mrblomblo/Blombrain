name: Desktop Linux Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKitGTK / Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Build frontend, backend, and Node SEA sidecar
        run: |
          npm run build:frontend
          npm run build:backend
          npm run build:sidecar

      - name: Build Tauri Linux bundles (.deb and .AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "1"
        with:
          tagName: v__VERSION__
          releaseName: Blombrain Desktop v__VERSION__
          releaseDraft: true
          args: --bundles deb,appimage

      - name: Smoke test installed .deb headless
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          test -n "$DEB"
          sudo apt-get install -y "$DEB" xvfb
          echo "Installed $DEB cleanly."

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blombrain</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #181412;
      --surface: #221c18;
      --border: #3a3029;
      --text: #f3ede6;
      --muted: #b0a396;
      --accent: #d97736;
      --danger: #dc4c46;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card {
      width: min(560px, 92vw);
      padding: 28px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    p { font-size: 13px; margin: 0; color: var(--muted); line-height: 1.45; }
    pre {
      display: none;
      margin: 0;
      padding: 12px;
      max-height: 220px;
      overflow: auto;
      background: #120f0d;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .actions { display: none; gap: 10px; }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #2c241f;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .error .spinner { display: none; }
    .error h1 { color: var(--danger); }
    .error pre, .error .actions { display: flex; }
    .error pre { display: block; }
  </style>
</head>
<body>
  <div id="root" class="card">
    <div class="row">
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <h1 id="title">Starting Blombrain...</h1>
        <p id="status">Launching local backend service and preparing workspace.</p>
      </div>
    </div>
    <pre id="logs"></pre>
    <div class="actions">
      <button id="copy-btn" type="button">Copy logs</button>
    </div>
  </div>
  <script>
    window.__blombrainSetStatus = function(msg) {
      document.getElementById("status").textContent = msg;
    };
    window.__blombrainShowError = function(title, msg, logText) {
      var root = document.getElementById("root");
      root.classList.add("error");
      document.getElementById("title").textContent = title || "Failed to start Blombrain";
      document.getElementById("status").textContent = msg || "The local backend did not respond.";
      document.getElementById("logs").textContent = logText || "No log output captured.";
    };
    document.getElementById("copy-btn").addEventListener("click", function() {
      var text = document.getElementById("logs").textContent || "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        this.textContent = "Copied";
      }
    });
  </script>
</body>
</html>
